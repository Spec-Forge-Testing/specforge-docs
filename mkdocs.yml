site_name: Spec Forge Docs
site_description: Technical documentation for the Spec Forge project
repo_url: https://github.com/Spec-Forge-Testing/llm-pbt-agent
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/imgs/logo.png
  favicon: assets/imgs/logo.png
  
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top              # floating back-to-top button
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - navigation.footer

  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - User Guide:
      - Installation & Quick Start: user-guide/installation.md
      - Running with Docker: user-guide/docker.md
      - CLI Reference: user-guide/cli-reference.md
      - Run Report: user-guide/reports.md
      - Example Walkthrough: user-guide/example-walkthrough.md
      - LLM Providers: user-guide/llm-providers.md
  - Architecture: architecture/overview.md
  - Developer Guide:
      - Contributing & Testing: developer-guide/contributing.md
      - CLI Internals: developer-guide/cli-internals.md
      - Modules:
          - Core AST:
              - Overview: modules/core-ast/index.md
              - Reference: modules/core-ast/reference.md
              - API Reference: modules/core-ast/api-reference.md
              - Decision records:
                  - Overview: modules/core-ast/adr/index.md
                  - Locator: modules/core-ast/adr/locator.md
                  - AST builder: modules/core-ast/adr/ast-builder.md
                  - Extractor: modules/core-ast/adr/extractor.md
                  - Tracer: modules/core-ast/adr/tracer.md
                  - Quality: modules/core-ast/adr/quality.md
                  - Packager: modules/core-ast/adr/packager.md
                  - API: modules/core-ast/adr/api.md
                  - Foundations: modules/core-ast/adr/foundations.md
              - Integration Tests: modules/core-ast/integration-tests.md
          - Contract Engine:
              - Overview: modules/contract-engine/index.md
              - Reference: modules/contract-engine/reference.md
              - Decision records:
                  - Overview: modules/contract-engine/adr/index.md
                  - Ingestion: modules/contract-engine/adr/ingestion.md
          - Contracts (shared kernel): modules/contracts/index.md
          - Storage:
              - Overview: modules/storage/index.md
              - Data model: modules/storage/data-model.md
          - Semantic Inference:
              - Overview: modules/semantic-inference/index.md
              - LLM Router (LiteLLM): modules/semantic-inference/llm-router.md
          - Custom Schemathesis:
              - Overview: modules/custom-schemathesis/index.md
              - Architecture: modules/custom-schemathesis/architecture.md
              - Stateful fuzzing: modules/custom-schemathesis/stateful-fuzzing.md
              - Replay: modules/custom-schemathesis/replay.md
              - Strategy compiler internals: modules/custom-schemathesis/strategy-compiler-internals.md
              - Complete reference: modules/custom-schemathesis/reference.md
      - Test Corpora:
          - Overview: testing/index.md
          - RealWorld corpus: testing/real-world.md
          - EMB corpus: testing/emb.md
          - Polyglot corpus: testing/polyglot.md
          - Integration suite: testing/suite.md
