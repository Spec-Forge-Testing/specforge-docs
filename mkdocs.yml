site_name: Spec Forge Docs
site_description: Technical documentation for the Spec Forge project
repo_url: https://github.com/Spec-Forge-Testing/llm-pbt-agent
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/imgs/hex-mark.svg
  favicon: assets/imgs/hex-mark.svg
  
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top              # floating back-to-top button
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - navigation.footer

  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        modules/custom-schemathesis/index.md: modules/specforge-engine/index.md
        modules/custom-schemathesis/architecture.md: modules/specforge-engine/architecture.md
        modules/custom-schemathesis/data-flow.md: modules/specforge-engine/data-flow.md
        modules/custom-schemathesis/strategy-compiler.md: modules/specforge-engine/strategy-compiler.md
        modules/custom-schemathesis/engine-internals.md: modules/specforge-engine/engine-internals.md
        modules/custom-schemathesis/execution-modes.md: modules/specforge-engine/execution-modes.md
        modules/custom-schemathesis/progress-and-cancellation.md: modules/specforge-engine/progress-and-cancellation.md
        modules/custom-schemathesis/extension-guide.md: modules/specforge-engine/extension-guide.md
        modules/custom-schemathesis/api-reference.md: modules/specforge-engine/api-reference.md
        modules/custom-schemathesis/testing.md: modules/specforge-engine/testing.md
        modules/custom-schemathesis/adr/index.md: modules/specforge-engine/adr/index.md
        modules/custom-schemathesis/adr/foundations.md: modules/specforge-engine/adr/foundations.md
        modules/custom-schemathesis/adr/models.md: modules/specforge-engine/adr/models.md
        modules/custom-schemathesis/adr/api.md: modules/specforge-engine/adr/api.md
        modules/custom-schemathesis/adr/compiler.md: modules/specforge-engine/adr/compiler.md
        modules/custom-schemathesis/adr/engine.md: modules/specforge-engine/adr/engine.md
        modules/custom-schemathesis/engine-implementation.md: modules/specforge-engine/engine-internals.md
        modules/custom-schemathesis/reference.md: modules/specforge-engine/api-reference.md
        modules/custom-schemathesis/replay.md: modules/specforge-engine/execution-modes.md
        modules/custom-schemathesis/stateful-fuzzing.md: modules/specforge-engine/execution-modes.md
        modules/custom-schemathesis/strategy-compiler-internals.md: modules/specforge-engine/strategy-compiler.md
        modules/contract-engine/index.md: modules/contract-assembly/index.md
        modules/contract-engine/reference.md: modules/contract-assembly/reference.md
        modules/contract-engine/adr/index.md: modules/contract-assembly/adr/index.md
        modules/contract-engine/adr/ingestion.md: modules/contract-assembly/adr/ingestion.md

